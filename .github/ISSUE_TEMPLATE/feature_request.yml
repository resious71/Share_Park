name: ✨ 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해 주세요.
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편함이 있나요?
      description: 이 기능이 필요한 상황을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 원하는 해결 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      multiple: true
      options:
        - 도서 목록 · 검색 · 정렬
        - 다운로드 · 동의서
        - 마이페이지
        - 관리자 (계정 · 도서 · 설정 · 통계)
        - 디자인 · 접근성
        - 설치 · 문서
